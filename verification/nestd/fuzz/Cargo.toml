[package]
name = "nestd-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[package.metadata]
cargo-fuzz = true

# Standalone: not a member of the repo workspace, so `cargo test --workspace` never builds it.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
nest-protocol = { path = "../../../crates/nest-protocol" }
# `recovery::read_meta` / `write_meta` (meta_json) and `fleet::decode` (fleet_to_host).
nestd = { path = "../../../crates/nestd" }
# The fleet core's input type, which `fleet::decode` returns.
nestd-core = { path = "../../../crates/nestd-core" }
# The WebSocket message `fleet::decode` takes (nestd's version, so the lockfile holds one).
tokio-tungstenite = "0.30.0"
bytes = "1.12.1"
nix = { version = "0.31", features = ["socket", "uio"] }
serde = "1"
serde_json = "1.0.154"
tokio-util = { version = "0.7.20", features = ["codec"] }

[lib]
name = "nestd_fuzz"
path = "src/lib.rs"

[[bin]]
name = "guest_stream"
path = "fuzz_targets/guest_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guest_control_json"
path = "fuzz_targets/guest_control_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vsock_handshake"
path = "fuzz_targets/vsock_handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_events"
path = "fuzz_targets/proxy_events.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gateway_events"
path = "fuzz_targets/gateway_events.rs"
test = false
doc = false
bench = false

[[bin]]
name = "runner_events"
path = "fuzz_targets/runner_events.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fleet_to_host"
path = "fuzz_targets/fleet_to_host.rs"
test = false
doc = false
bench = false

[[bin]]
name = "meta_json"
path = "fuzz_targets/meta_json.rs"
test = false
doc = false
bench = false

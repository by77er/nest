\* Reachability: its incarnation destroyed and the host retired, still failed. Expected: violates NoRetiredAfter.
SPECIFICATION Spec
CONSTANTS
  Hosts = {h1, h2}
  None = None
  MaxEpoch = 4
  MaxFail = 2
  MaxRetry = 2
  MaxDestroy = 1
  MaxLoss = 1
  MaxReset = 1
  MaxNoCap = 1
  SpendEpoch = TRUE
  Rollback = TRUE
  RetrySpends = TRUE
  DeleteExact = TRUE
  RecordStale = TRUE
  RetireWaits = TRUE
INVARIANTS
  NoRetiredAfter
CHECK_DEADLOCK FALSE

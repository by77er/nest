\* Liveness as MCLive with a place RPC delivered after its marker went stale. Expected: violates Placed (orphan lease; every later claim is refused).
SPECIFICATION LiveSpec
CONSTANTS
  Hosts = {h1, h2}
  None = None
  MaxEpoch = 3
  MaxSends = 0
  F = 2
  E = 3
  MaxCrash = 0
  MaxReset = 0
  MaxDisc = 0
  MaxLose = 0
  MaxDestroy = 0
  HistoryMax = 50
  RollbackEpoch = TRUE
  CommitEpochCheck = TRUE
  Stonith = TRUE
  ShuttingDownIsDead = TRUE
  WatchdogOnce = FALSE
  DelayedRpc = TRUE
  NoCapAllowed = TRUE
  FixDestroy = TRUE
  ResendFailIsFinal = FALSE
  FixSalvage = TRUE
  FixLeaseLost = TRUE
  FixStonithFence = TRUE
  FixQueue = TRUE
PROPERTIES
  Placed
CONSTRAINT StateBound
CHECK_DEADLOCK FALSE

\* #192 as merged (82e007f9): the operator's retry (lease.retried) doesn't spend an epoch. Expected: violates EpochAboveStale (a retry between FleetDO's release and SandboxDO's leaves it unplaced at the released epoch).
SPECIFICATION Spec
CONSTANTS
  Hosts = {h1, h2}
  None = None
  MaxEpoch = 4
  MaxFail = 2
  MaxRetry = 2
  MaxDestroy = 1
  MaxLoss = 1
  MaxReset = 1
  MaxNoCap = 1
  SpendEpoch = TRUE
  Rollback = TRUE
  RetrySpends = FALSE
  DeleteExact = TRUE
  RecordStale = TRUE
  RetireWaits = TRUE
INVARIANTS
  TypeOK
  EpochAboveStale
  SalvageAccepted
  OnlyItsLease
  NoWorkLostToRetire
CHECK_DEADLOCK FALSE

\* Mutation: scaleDown ignores incarnations not yet destroyed. Expected: violates NoWorkLostToRetire.
SPECIFICATION Spec
CONSTANTS
  Hosts = {h1, h2}
  None = None
  MaxEpoch = 4
  MaxFail = 2
  MaxRetry = 2
  MaxDestroy = 1
  MaxLoss = 1
  MaxReset = 1
  MaxNoCap = 1
  SpendEpoch = TRUE
  Rollback = TRUE
  RetrySpends = TRUE
  DeleteExact = TRUE
  RecordStale = TRUE
  RetireWaits = FALSE
INVARIANTS
  NoWorkLostToRetire
CHECK_DEADLOCK FALSE

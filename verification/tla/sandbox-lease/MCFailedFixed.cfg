\* As built: the release and the operator's retry each spend an epoch. Two hosts, epochs <= 4, two failures, two retries, one of each fault. Expected: holds.
SPECIFICATION Spec
CONSTANTS
  Hosts = {h1, h2}
  None = None
  MaxEpoch = 4
  MaxFail = 2
  MaxRetry = 2
  MaxDestroy = 1
  MaxLoss = 1
  MaxReset = 1
  MaxNoCap = 1
  SpendEpoch = TRUE
  Rollback = TRUE
  RetrySpends = TRUE
  DeleteExact = TRUE
  RecordStale = TRUE
  RetryRecords = TRUE
  RetireWaits = TRUE
INVARIANTS
  TypeOK
  EpochAboveStale
  SalvageAccepted
  OnlyItsLease
  NoWorkLostToRetire
CHECK_DEADLOCK FALSE

\* Mutation of the timing assumption: the host self-fences no earlier than
\* FleetDO expires it (F = E).  Fault: one partition.
\* Expected: violates OneActingBrain.
CONSTANTS
  Hosts = {h1, h2}
  NoHost = NoHost
  MaxEpoch = 3
  MaxFaults = 1
  MaxTurns = 1
  F = 3
  E = 3
  RECORD = TRUE
  FIX_H1 = TRUE
  FIX_H3 = TRUE
  FIX_H4 = TRUE
  FIX_DRAIN = TRUE
  A1 = TRUE
  A2 = TRUE
  LOSS_EPOCH = TRUE
  A3 = FALSE
  REFUSED_WAITS = FALSE
  START_FAIL = FALSE
  A5 = FALSE
  A6 = FALSE
  SPLIT_EXPIRE = FALSE
  EXPIRE_RECHECK = FALSE
  NO_REISSUE = FALSE
  NO_ADOPT = FALSE
  OLD_HOST = NoHost
  WAIT = TRUE
  TOMBSTONE = TRUE
  ACK_DELAY = FALSE
  ALLOW_CRASH = FALSE
  ALLOW_PART = TRUE
  ALLOW_LOST = FALSE
  ALLOW_RESET = FALSE
  ALLOW_WEDGE = FALSE
  ALLOW_DRAIN = FALSE
  ALLOW_IDLE = FALSE
  ALLOW_STOP = FALSE
SPECIFICATION Spec
CONSTRAINT Bounds
SYMMETRY Perms
INVARIANTS
  OneActingBrain

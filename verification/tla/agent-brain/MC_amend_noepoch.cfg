\* Amended record design, but host loss carries no epoch (onHostLost(host),
\* as in the code) while A2 retries it.  Faults: a partition, a lost
\* onHostLost answer.  Checks whether a late or repeated onHostLost can
\* release a newer brain on a host that came back.
CONSTANTS
  Hosts = {h1, h2}
  NoHost = NoHost
  MaxEpoch = 3
  MaxFaults = 2
  MaxTurns = 1
  F = 2
  E = 3
  RECORD = TRUE
  FIX_H1 = TRUE
  FIX_H3 = TRUE
  FIX_H4 = TRUE
  FIX_DRAIN = TRUE
  A1 = TRUE
  A2 = TRUE
  LOSS_EPOCH = FALSE
  A3 = FALSE
  REFUSED_WAITS = FALSE
  START_FAIL = FALSE
  A5 = FALSE
  A6 = FALSE
  SPLIT_EXPIRE = FALSE
  EXPIRE_RECHECK = FALSE
  NO_REISSUE = FALSE
  WAIT = TRUE
  TOMBSTONE = TRUE
  ACK_DELAY = FALSE
  ALLOW_CRASH = FALSE
  ALLOW_PART = TRUE
  ALLOW_LOST = TRUE
  ALLOW_RESET = FALSE
  ALLOW_WEDGE = FALSE
  ALLOW_DRAIN = FALSE
  ALLOW_IDLE = FALSE
  ALLOW_STOP = FALSE
SPECIFICATION Spec
CONSTRAINT Bounds
SYMMETRY Perms
INVARIANTS
  OneActingBrain

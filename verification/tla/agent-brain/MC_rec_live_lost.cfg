\* Record design, every fix + FIX_RESEND; a host crash and a lost onHostLost
\* RPC (brainsLost only logs its failure).  Expected: violates NoWedge (the
\* record keeps naming the dead host; rule 4 can neither wedge an expired
\* host nor release, so the agent is stuck).
CONSTANTS
  Hosts = {h1, h2}
  NoHost = NoHost
  MaxEpoch = 3
  MaxFaults = 2
  MaxTurns = 1
  F = 2
  E = 3
  RECORD = TRUE
  FIX_H1 = TRUE
  FIX_H3 = TRUE
  FIX_H4 = TRUE
  FIX_DRAIN = TRUE
  A1 = TRUE
  A2 = FALSE
  LOSS_EPOCH = TRUE
  A3 = FALSE
  REFUSED_WAITS = FALSE
  START_FAIL = FALSE
  A5 = FALSE
  A6 = FALSE
  SPLIT_EXPIRE = FALSE
  EXPIRE_RECHECK = FALSE
  NO_REISSUE = FALSE
  NO_ADOPT = FALSE
  OLD_HOST = NoHost
  WAIT = TRUE
  TOMBSTONE = TRUE
  ACK_DELAY = FALSE
  ALLOW_CRASH = TRUE
  ALLOW_PART = FALSE
  ALLOW_LOST = TRUE
  ALLOW_RESET = FALSE
  ALLOW_WEDGE = FALSE
  ALLOW_DRAIN = FALSE
  ALLOW_IDLE = FALSE
  ALLOW_STOP = FALSE
SPECIFICATION LiveSpec
CONSTRAINT Bounds
PROPERTIES
  TurnsDrain
  NoWedge

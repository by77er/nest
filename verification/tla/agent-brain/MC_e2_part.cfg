\* Fully amended record design: every H-fix, A1-A6, REFUSED_WAITS (A4).
\* Bound: 2 hosts (symmetric), epochs <= 2, one turn, F = 1 < E = 2,
\* queues <= 2/2/3, fault budget below (one kind per config).
CONSTANTS
  Hosts = {h1, h2}
  NoHost = NoHost
  MaxEpoch = 2
  MaxFaults = 1
  MaxTurns = 1
  F = 1
  E = 2
  RECORD = TRUE
  FIX_H1 = TRUE
  FIX_H3 = TRUE
  FIX_H4 = TRUE
  FIX_DRAIN = TRUE
  A1 = TRUE
  A2 = TRUE
  LOSS_EPOCH = TRUE
  A3 = TRUE
  REFUSED_WAITS = TRUE
  START_FAIL = FALSE
  A5 = TRUE
  A6 = TRUE
  SPLIT_EXPIRE = FALSE
  EXPIRE_RECHECK = FALSE
  NO_REISSUE = FALSE
  NO_ADOPT = FALSE
  OLD_HOST = NoHost
  WAIT = TRUE
  TOMBSTONE = TRUE
  ACK_DELAY = FALSE
  ALLOW_CRASH = FALSE
  ALLOW_PART = TRUE
  ALLOW_LOST = FALSE
  ALLOW_RESET = FALSE
  ALLOW_WEDGE = FALSE
  ALLOW_DRAIN = FALSE
  ALLOW_IDLE = FALSE
  ALLOW_STOP = FALSE
SPECIFICATION Spec
CONSTRAINT SmallBounds
SYMMETRY Perms
INVARIANTS
  TypeOK
  OneActingBrain
  CondemnedFenced
  KillTombstone
  NoHealthyWedge
PROPERTIES
  NoEpochRegression

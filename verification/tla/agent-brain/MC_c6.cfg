\* C6 (regression): the current design at epochs <= 3 with BOTH host-loss guards off (no epoch bound, no lost re-check). Expected: violates OneActingBrain. Covered on main by control-plane/test/agent-seams.test.ts:918.
\* Bound: 2 hosts (symmetric), epochs <= 3 (E3Bounds: not every host silent at once), one turn, F = 1 < E = 2,
\* queues <= 2/2/3, fault budget below (one kind per config).
CONSTANTS
  Hosts = {h1, h2}
  NoHost = NoHost
  MaxEpoch = 3
  MaxFaults = 0
  MaxTurns = 1
  F = 1
  E = 2
  RECORD = TRUE
  FIX_H1 = TRUE
  FIX_H3 = TRUE
  FIX_H4 = TRUE
  FIX_DRAIN = TRUE
  A1 = TRUE
  A2 = TRUE
  LOSS_EPOCH = FALSE
  A3 = TRUE
  REFUSED_WAITS = TRUE
  START_FAIL = FALSE
  A5 = TRUE
  A6 = TRUE
  SPLIT_EXPIRE = TRUE
  EXPIRE_RECHECK = TRUE
  NO_REISSUE = TRUE
  NO_ADOPT = TRUE
  OLD_HOST = NoHost
  LOST_RECHECK = FALSE
  WAIT = TRUE
  TOMBSTONE = TRUE
  ACK_DELAY = FALSE
  ALLOW_CRASH = FALSE
  ALLOW_PART = FALSE
  ALLOW_LOST = FALSE
  ALLOW_RESET = FALSE
  ALLOW_WEDGE = FALSE
  ALLOW_DRAIN = FALSE
  ALLOW_IDLE = FALSE
  ALLOW_STOP = FALSE
SPECIFICATION Spec
CONSTRAINT E3Bounds
SYMMETRY Perms
INVARIANTS
  TypeOK
  OneActingBrain
  CondemnedFenced
  KillTombstone
  NoHealthyWedge
PROPERTIES
  NoEpochRegression

\* As built (brain-record 6073da7): fully amended, but release on a lost host ignores the epoch.
\* Bound: 2 hosts (symmetric), epochs <= 2, one turn, F = 1 < E = 2,
\* queues <= 2/2/3, fault budget below (one kind per config).
CONSTANTS
  Hosts = {h1, h2}
  NoHost = NoHost
  MaxEpoch = 2
  MaxFaults = 0
  MaxTurns = 1
  F = 1
  E = 2
  RECORD = TRUE
  FIX_H1 = TRUE
  FIX_H3 = TRUE
  FIX_H4 = TRUE
  FIX_DRAIN = TRUE
  A1 = TRUE
  A2 = TRUE
  LOSS_EPOCH = FALSE
  A3 = TRUE
  REFUSED_WAITS = TRUE
  START_FAIL = FALSE
  A5 = TRUE
  A6 = TRUE
  SPLIT_EXPIRE = FALSE
  EXPIRE_RECHECK = FALSE
  NO_REISSUE = FALSE
  NO_ADOPT = FALSE
  OLD_HOST = NoHost
  LOST_RECHECK = FALSE
  WAIT = TRUE
  TOMBSTONE = TRUE
  ACK_DELAY = FALSE
  ALLOW_CRASH = FALSE
  ALLOW_PART = FALSE
  ALLOW_LOST = FALSE
  ALLOW_RESET = FALSE
  ALLOW_WEDGE = FALSE
  ALLOW_DRAIN = FALSE
  ALLOW_IDLE = FALSE
  ALLOW_STOP = FALSE
  SPLIT_RESTART = FALSE
  PUMP_GUARD = FALSE
SPECIFICATION Spec
CONSTRAINT SmallBounds
SYMMETRY Perms
INVARIANTS
  TypeOK
  OneActingBrain
  CondemnedFenced
  KillTombstone
  NoHealthyWedge
PROPERTIES
  NoEpochRegression

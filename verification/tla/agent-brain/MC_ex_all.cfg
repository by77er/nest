\* Exhaustive S check of the fully amended design (every H-fix, A1-A4) at a
\* small bound: 2 hosts (symmetric), epochs <= 3, one turn, ONE fault of any
\* class, F = 1 < E = 2, queues <= 3/3/4.  Expected: holds.
CONSTANTS
  Hosts = {h1, h2}
  NoHost = NoHost
  MaxEpoch = 3
  MaxFaults = 1
  MaxTurns = 1
  F = 1
  E = 2
  RECORD = TRUE
  FIX_H1 = TRUE
  FIX_H3 = TRUE
  FIX_H4 = TRUE
  FIX_DRAIN = TRUE
  A1 = TRUE
  A2 = TRUE
  LOSS_EPOCH = TRUE
  A3 = TRUE
  REFUSED_WAITS = TRUE
  START_FAIL = FALSE
  A5 = FALSE
  A6 = FALSE
  SPLIT_EXPIRE = FALSE
  EXPIRE_RECHECK = FALSE
  NO_REISSUE = FALSE
  NO_ADOPT = FALSE
  OLD_HOST = NoHost
  LOST_RECHECK = FALSE
  WAIT = TRUE
  TOMBSTONE = TRUE
  ACK_DELAY = FALSE
  ALLOW_CRASH = TRUE
  ALLOW_PART = TRUE
  ALLOW_LOST = TRUE
  ALLOW_RESET = TRUE
  ALLOW_WEDGE = TRUE
  ALLOW_DRAIN = TRUE
  ALLOW_IDLE = TRUE
  ALLOW_STOP = FALSE
  SPLIT_RESTART = FALSE
  PUMP_GUARD = FALSE
SPECIFICATION Spec
CONSTRAINT Bounds
SYMMETRY Perms
INVARIANTS
  TypeOK
  OneActingBrain
  CondemnedFenced
  KillTombstone
  NoHealthyWedge
PROPERTIES
  NoEpochRegression

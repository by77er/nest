  A1 = TRUE
  A2 = TRUE
  LOSS_EPOCH = TRUE
  A3 = FALSE
  REFUSED_WAITS = FALSE
  START_FAIL = FALSE
  A5 = FALSE
  A6 = FALSE
  SPLIT_EXPIRE = FALSE
  EXPIRE_RECHECK = FALSE
  NO_REISSUE = FALSE
  NO_ADOPT = FALSE

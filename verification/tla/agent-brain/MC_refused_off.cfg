\* Record design with every fix and A1-A3, but a tombstone-refused start's
\* exit reported at once (REFUSED_WAITS off).  Faults: an idle exit, a drain.
\* Expected: violates OneActingBrain (the implementer's hole: the refused
\* N+1's exit releases while brain N is still dying).
CONSTANTS
  Hosts = {h1, h2}
  NoHost = NoHost
  MaxEpoch = 3
  MaxFaults = 2
  MaxTurns = 1
  F = 2
  E = 3
  RECORD = TRUE
  FIX_H1 = TRUE
  FIX_H3 = TRUE
  FIX_H4 = TRUE
  FIX_DRAIN = TRUE
  A1 = TRUE
  A2 = TRUE
  LOSS_EPOCH = TRUE
  A3 = TRUE
  REFUSED_WAITS = FALSE
  START_FAIL = FALSE
  A5 = FALSE
  A6 = FALSE
  SPLIT_EXPIRE = FALSE
  EXPIRE_RECHECK = FALSE
  NO_REISSUE = FALSE
  NO_ADOPT = FALSE
  OLD_HOST = NoHost
  WAIT = TRUE
  TOMBSTONE = TRUE
  ACK_DELAY = FALSE
  ALLOW_CRASH = FALSE
  ALLOW_PART = FALSE
  ALLOW_LOST = FALSE
  ALLOW_RESET = FALSE
  ALLOW_WEDGE = FALSE
  ALLOW_DRAIN = TRUE
  ALLOW_IDLE = TRUE
  ALLOW_STOP = FALSE
SPECIFICATION Spec
CONSTRAINT Bounds
SYMMETRY Perms
INVARIANTS
  OneActingBrain

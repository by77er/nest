# The checks every change to main must pass. See dev/ci.md. Branch protection requires only
# `ci-ok`, so adding a job here never needs a settings change.
# `plan` runs the repo checks and decides which jobs a change needs (scripts/ci-changes.py); a push
# to main whose tree a pull request's run already passed runs nothing again (dev/ci.md#what-runs).
# Actions are pinned by commit; the comment names the release.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tests that need user namespaces fail instead of skipping (see crates/nestd/README.md).
  NEST_CI_REQUIRE_USERNS: "1"

jobs:
  # The cheap checks every change gets, and which of the jobs below it needs. Everything else waits
  # for this, so a failing guard costs no Rust build.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # To find the pull request a push merged, and the artifact its passing run left for this tree.
      actions: read
      pull-requests: read
    # Explicit, for `-o pipefail`: the default shell is `bash -e` alone, under which a failed
    # `git diff` would feed the mapping nothing and skip every job.
    defaults:
      run:
        shell: bash
    env:
      GITLEAKS: v8.30.1
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      rust: ${{ steps.jobs.outputs.rust }}
      control-plane: ${{ steps.jobs.outputs.control-plane }}
      dashboard: ${{ steps.jobs.outputs.dashboard }}
      projects: ${{ steps.jobs.outputs.projects }}
      e2e: ${{ steps.jobs.outputs.e2e }}
      infra: ${{ steps.jobs.outputs.infra }}
      verify-nestd: ${{ steps.jobs.outputs.verify-nestd }}
      fuzz-nestd: ${{ steps.jobs.outputs.fuzz-nestd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # Guards: doc links, source fences for the CLAUDE.md invariants, and tests proving each guard
      # can fail.
      - run: python3 -I scripts/check-doc-links.py
      - run: python3 -I scripts/check-fences.py
      - run: python3 -I scripts/check-core-manifest.py
      # PyYAML, pinned by hash, in a venv (the runner's Python is externally managed).
      - run: |
          python3 -m venv "$RUNNER_TEMP/guards"
          "$RUNNER_TEMP/guards/bin/pip" install --require-hashes --only-binary :all: -r scripts/requirements-guards.txt
      - run: '"$RUNNER_TEMP/guards/bin/python" -I scripts/check-workflows.py'
      - run: '"$RUNNER_TEMP/guards/bin/python" -m unittest discover -s scripts/tests'
      # Secrets: gitleaks over the full history, built from source (the Go checksum database
      # verifies the module) once per version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gitleaks
        with:
          path: ~/gitleaks-bin
          key: gitleaks-${{ runner.os }}-${{ env.GITLEAKS }}
      - if: steps.gitleaks.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/gitleaks-bin" go install "github.com/zricethezav/gitleaks/v8@$GITLEAKS"
      - run: '"$HOME/gitleaks-bin/gitleaks" git --redact --no-banner -c .gitleaks.toml .'
      # A squash merge whose tree equals the one its pull request's run tested (main didn't move in
      # between) has passed already: ci-ok of that run uploaded `ci-passed-<tree>`. Only a run of the
      # pull request this push merged counts, so no other pull request's workflow can vouch for it.
      - name: Passed already as a pull request?
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.tree }}
        # Any lookup that fails means no reuse: the push then runs what its diff needs.
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            -q '[.[] | select(.merged_at != null and .merge_commit_sha == env.GITHUB_SHA)][0].head.sha // empty') || head=
          [ -n "$head" ] || exit 0
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$TREE&per_page=20" \
            -q ".artifacts[] | select((.expired | not) and .workflow_run.head_sha == \"$head\") | .workflow_run.id") || runs=
          for run in $runs; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" -q '[.path, .event, .conclusion, .head_sha] | join(" ")' || true)" \
                = ".github/workflows/ci.yml pull_request success $head" ]; then
              echo "run=$run" >> "$GITHUB_OUTPUT"
              echo "::notice::Tree $TREE passed in run $run (its pull request); no job runs again."
              break
            fi
          done
      - name: Which jobs this change needs
        id: jobs
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REUSED: ${{ steps.reuse.outputs.run }}
        # A pull request is checked out as its merge commit, whose first parent is the base.
        run: |
          if [ -n "$REUSED" ]; then
            python3 -I scripts/ci-changes.py --none
          elif [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames 'HEAD^1' HEAD | python3 -I scripts/ci-changes.py
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames "$BEFORE" HEAD | python3 -I scripts/ci-changes.py
          else
            python3 -I scripts/ci-changes.py --all
          fi | tee -a "$GITHUB_OUTPUT"

  rust:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Line tables are enough for test backtraces and keep `target` (cached, then tarred again for the
      # cache save) small enough for the runner's disk, which ran out during that save.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_DENY: 0.20.2
    steps:
      # The runner image's preinstalled toolchains this job never uses: about 25 GB back.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # v2: built with line tables only; never restore the older, fuller target.
          key: rust-v2-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-v2-${{ runner.os }}-
      # nestd's netns tests need iproute2, nftables and unprivileged user namespaces; its shadow-cut
      # tests a real XFS with reflink (NEST_TEST_XFS_DIR), loop-mounted here.
      - name: Host tools
        run: |
          sudo apt-get update -q && sudo apt-get install -yq nftables xfsprogs
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          truncate -s 2G "$RUNNER_TEMP/xfs.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/xfs.img"
          sudo mkdir -p /mnt/nest-xfs
          sudo mount -o loop "$RUNNER_TEMP/xfs.img" /mnt/nest-xfs
          sudo chown "$(id -u):$(id -g)" /mnt/nest-xfs
          echo "NEST_TEST_XFS_DIR=/mnt/nest-xfs" >> "$GITHUB_ENV"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # nestd-core's purity: on a target with no std, code that uses std fails to build.
      # (scripts/check-core-manifest.py, in `guards`, rejects cfg on target_* so none can hide.)
      - name: nestd-core builds without std
        run: |
          rustup target add x86_64-unknown-none
          cargo build -p nestd-core --target x86_64-unknown-none --locked
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      # cargo-deny (deny.toml): RustSec advisories, licenses, wildcards, unknown sources.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY }}-${{ hashFiles('rust-toolchain.toml') }}
      - if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-deny@$CARGO_DENY"
      - run: cargo deny --locked check
      # The standalone verification crates have their own lockfiles; same policy.
      - run: cargo deny --manifest-path verification/nestd/check/Cargo.toml --config deny.toml --locked check
      - run: cargo deny --manifest-path verification/nestd/fuzz/Cargo.toml --config deny.toml --locked check

  control-plane:
    needs: plan
    if: needs.plan.outputs.control-plane == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  dashboard:
    needs: plan
    if: needs.plan.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  projects:
    needs: plan
    if: needs.plan.outputs.projects == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/e2e
          key: e2e-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: e2e-${{ runner.os }}-
      - name: Host tools
        run: |
          sudo apt-get update -q && sudo apt-get install -yq nftables uidmap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # The harness runs the gateway as its own uid: a subordinate id range to map it from.
          for f in /etc/subuid /etc/subgid; do
            grep -q "^$(id -un):" "$f" 2>/dev/null || echo "$(id -un):100000:65536" | sudo tee -a "$f"
          done
      - name: Install control plane
        run: npm ci
        working-directory: control-plane
      # The probe harness's own tests; they use a stub, never the real claude.
      - name: claude-verify harness tests
        run: python3 -m unittest discover -s e2e/claude-verify
      # Outside the home directory, which the gateway's own uid may not be able to enter.
      - name: End to end (fake brain)
        run: e2e/run.sh
        env:
          NEST_E2E_WORK: /tmp/nest-e2e
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: |
            /tmp/nest-e2e/logs
            /tmp/nest-e2e/summary.json
          retention-days: 7

  # The cell stack's proofs and graph policies (deploy/lean/Cell/Test.lean), with no AWS
  # credentials: a pull request can't change IAM in a way that breaks a theorem. Plans run only
  # in deploy.yml, which holds the credentials. Also the projects app's own stack (projects/deploy/),
  # applied by deploy-projects-infra.yml.
  infra:
    needs: plan
    if: needs.plan.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            ~/.cargo/bin/inframe
            ~/.cargo/bin/.inframe-rev
            deploy/lean/.lake
            deploy/lean/.generated
            projects/deploy/lean/.lake
            projects/deploy/lean/.generated
          key: infra-v2-${{ runner.os }}-${{ hashFiles('scripts/infra-tools.sh', 'deploy/lean/lean-toolchain', 'deploy/lean/lake-manifest.json', 'deploy/aws-schema.json', 'deploy/cloudflare-schema.json', 'projects/deploy/lean/lean-toolchain', 'projects/deploy/lean/lake-manifest.json', 'projects/deploy/cloudflare-schema.json') }}
          restore-keys: infra-v2-${{ runner.os }}-
      - run: scripts/infra-tools.sh
      - name: Proofs and policies
        working-directory: deploy
        run: |
          inframe provider generate aws --frontend lean --schema-json aws-schema.json
          inframe provider generate cloudflare --frontend lean --schema-json cloudflare-schema.json
          # The host scripts Cell.Stack embeds (include_str) are input_file targets in lakefile.toml, so
          # a cached .lake rebuilds the stack when they change.
          inframe test --stack use1
          inframe test --stack edge
      - name: Projects app's proofs and policies
        working-directory: projects/deploy
        run: |
          inframe provider generate cloudflare --frontend lean --schema-json cloudflare-schema.json
          inframe test --stack projects

  # nestd's cores checked as the code that ships (docs/verification/nestd/): the Stateright checks
  # at CI bounds and mutation testing of nestd-core. Both crates are standalone (own lockfiles).
  verify-nestd:
    needs: plan
    if: needs.plan.outputs.verify-nestd == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_MUTANTS: 27.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-mutants
            verification/nestd/check/target
            target
          key: verify-nestd-${{ runner.os }}-${{ env.CARGO_MUTANTS }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'verification/nestd/check/Cargo.lock') }}
          restore-keys: verify-nestd-${{ runner.os }}-${{ env.CARGO_MUTANTS }}-
      - name: Model checks (bounded; the every-fault run is `--include-ignored`)
        working-directory: verification/nestd/check
        run: |
          cargo clippy --release --all-targets --locked -- -D warnings
          cargo test --release --locked
      - name: Mutation testing of nestd-core (0 missed expected)
        run: |
          command -v cargo-mutants || cargo install --locked "cargo-mutants@$CARGO_MUTANTS"
          # In place, so the cached `target/` above is the one it builds in (a copied tree would
          # build from scratch every run).
          cargo mutants -p nestd-core --in-place --timeout 60

  # Kani proofs of nestd-core's decision functions (bounded; see docs/verification/nestd/).
  kani-nestd:
    needs: plan
    if: needs.plan.outputs.verify-nestd == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KANI: 0.68.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
          key: kani-${{ runner.os }}-${{ env.KANI }}
      - name: Kani
        run: |
          command -v cargo-kani || cargo install --locked "kani-verifier@$KANI"
          cargo kani setup
          cargo kani -p nestd-core

  # Every wire parser nestd runs at a trust boundary, guest (vsock) first. The PR gate is
  # deterministic: the seeds still decode, and every target replays the seeds and the corpus the
  # scheduled fuzzing grew (fuzz.yml), once each. Timed fuzzing runs only on that schedule.
  fuzz-nestd:
    needs: plan
    if: needs.plan.outputs.fuzz-nestd == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_FUZZ: 0.13.2
    defaults:
      run:
        working-directory: verification/nestd/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (verification/nestd/fuzz/rust-toolchain.toml, a pinned nightly)
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-fuzz
            verification/nestd/fuzz/target
          key: fuzz-nestd-${{ runner.os }}-${{ env.CARGO_FUZZ }}-${{ hashFiles('verification/nestd/fuzz/rust-toolchain.toml', 'verification/nestd/fuzz/Cargo.lock') }}
          restore-keys: fuzz-nestd-${{ runner.os }}-${{ env.CARGO_FUZZ }}-
      - run: command -v cargo-fuzz || cargo install --locked "cargo-fuzz@$CARGO_FUZZ"
      - name: Seeds still decode
        run: python3 -I gen_seeds.py && cargo test --locked
      - name: The scheduled runs' corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: verification/nestd/fuzz/corpus
          key: fuzz-corpus-${{ runner.os }}-
          restore-keys: fuzz-corpus-${{ runner.os }}-
      - name: Replay the seeds and the corpus through every target
        run: |
          for t in guest_stream guest_control_json vsock_handshake proxy_events gateway_events runner_events fleet_to_host meta_json; do
            ./run.sh "$t" replay
          done
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: verification/nestd/fuzz/artifacts
          retention-days: 7

  # Each job ran and passed if `plan` said the change needs it, and was skipped otherwise. A pull
  # request's pass leaves `ci-passed-<tree>` for the push of its squash merge (see `plan`).
  ci-ok:
    if: always()
    needs: [plan, rust, control-plane, dashboard, projects, e2e, infra, verify-nestd, kani-nestd, fuzz-nestd]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I -c '
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          plan = needs.pop("plan")
          if plan["result"] != "success":
              sys.exit("plan: " + plan["result"])
          want = {k: plan["outputs"].get("verify-nestd" if k == "kani-nestd" else k) == "true" for k in needs}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != ("success" if want[k] else "skipped")}
          print(bad or {k: v["result"] for k, v in needs.items()})
          sys.exit(1 if bad else 0)'
      - if: github.event_name == 'pull_request'
        run: echo "$TREE" > "$RUNNER_TEMP/ci-passed"
        env:
          TREE: ${{ needs.plan.outputs.tree }}
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-passed-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/ci-passed
          if-no-files-found: error
          retention-days: 7

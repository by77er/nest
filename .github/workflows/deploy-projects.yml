# Deploys the projects app's Worker (projects/) on every push to main that touches it, apart from
# nest's deploy and from the app's own infra stack (projects/deploy/, deploy-projects-infra.yml):
# the app is not part of nest, and reaches it only through its client interface.
name: deploy-projects
on:
  push:
    branches: [main]
    paths: [projects/**, "!projects/deploy/**", .github/workflows/deploy-projects.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: projects
  cancel-in-progress: false
jobs:
  projects:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEST_CLIENT_TOKEN: ${{ secrets.PROJECTS_NEST_CLIENT_TOKEN }}
          NEST_WEBHOOK_SECRET: ${{ secrets.PROJECTS_NEST_WEBHOOK_SECRET }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.PROJECTS_GITHUB_WEBHOOK_SECRET }}
        run: |
          npx wrangler deploy
          # The Worker's secrets persist across versions, so each is put only when the environment has it.
          for name in NEST_CLIENT_TOKEN NEST_WEBHOOK_SECRET GITHUB_WEBHOOK_SECRET; do
            if [ -n "${!name:-}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name"
            fi
          done

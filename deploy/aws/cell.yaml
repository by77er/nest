AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  nest cell: network, S3 bucket, host role, launch template and the control plane's IAM user.
  See docs/compute/provisioning/ and docs/setup/. Creates no instances.

Parameters:
  Cell:
    Type: String
    Default: use1
    AllowedPattern: "[a-z0-9]+"
  RootCaKeyArn:
    Type: String
    Default: ""
    Description: The proxy root CA KMS key; empty until it exists. Grants the control plane kms:Sign on it.
  HostImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.18-x86_64
    Description: Amazon Linux 2023 (kernel 6.18) until the burst host image is built.

Conditions:
  HasRootCaKey: !Not [!Equals [!Ref RootCaKeyArn, ""]]

Resources:
  # --- Network: public subnets with public IPv4, no NAT, S3 gateway endpoint.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "nest-${Cell}" }, { Key: nest, Value: "true" }]
  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "nest-${Cell}" }, { Key: nest, Value: "true" }]
  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "nest-${Cell}" }, { Key: nest, Value: "true" }]
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties: { RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/20
      AvailabilityZone: !Sub "${AWS::Region}a"
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "nest-${Cell}-a" }, { Key: nest, Value: "true" }]
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.16.0/20
      AvailabilityZone: !Sub "${AWS::Region}b"
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "nest-${Cell}-b" }, { Key: nest, Value: "true" }]
  SubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.32.0/20
      AvailabilityZone: !Sub "${AWS::Region}c"
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "nest-${Cell}-c" }, { Key: nest, Value: "true" }]
  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }
  SubnetCRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetC, RouteTableId: !Ref RouteTable }
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref RouteTable]

  # Outbound 443, plus 7844 TCP and UDP for cloudflared. No inbound rules.
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "nest-${Cell}-host"
      GroupDescription: nest burst hosts; egress 443 and cloudflared 7844 only, no ingress
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 7844, ToPort: 7844, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: udp, FromPort: 7844, ToPort: 7844, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: nest, Value: "true" }]

  # --- The cell's bucket: versioned Standard; noncurrent versions expire after a day.
  CellBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "nest-${Cell}-${AWS::AccountId}"
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      Tags: [{ Key: nest, Value: "true" }]
  CellBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CellBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt CellBucket.Arn, !Sub "${CellBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }
          # The host role's credentials work only from inside the cell's VPC.
          - Sid: HostsOnlyThroughEndpoint
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt CellBucket.Arn, !Sub "${CellBucket.Arn}/*"]
            Condition:
              ArnEquals: { aws:PrincipalArn: !GetAtt HostRole.Arn }
              StringNotEquals: { aws:SourceVpce: !Ref S3Endpoint }

  # --- Host instance role: S3 on the cell's bucket only.
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "nest-${Cell}-host"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: cell-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions, s3:GetBucketLocation]
                Resource: !Sub "arn:${AWS::Partition}:s3:::nest-${Cell}-${AWS::AccountId}"
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion, s3:AbortMultipartUpload]
                Resource: !Sub "arn:${AWS::Partition}:s3:::nest-${Cell}-${AWS::AccountId}/*"
      Tags: [{ Key: nest, Value: "true" }]
  HostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "nest-${Cell}-host"
      Roles: [!Ref HostRole]

  # --- Launch template: nested virtualization, IMDSv2 with hop limit 1, tagged nest=true.
  # Instance type and market (spot) are chosen per launch; the control plane's policy limits types to 8i.
  HostLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "nest-${Cell}-host"
      LaunchTemplateData:
        ImageId: !Ref HostImageId
        IamInstanceProfile: { Arn: !GetAtt HostInstanceProfile.Arn }
        SecurityGroupIds: [!Ref HostSecurityGroup]
        CpuOptions: { NestedVirtualization: enabled }
        MetadataOptions: { HttpEndpoint: enabled, HttpTokens: required, HttpPutResponseHopLimit: 1, InstanceMetadataTags: disabled }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: nest, Value: "true" }, { Key: nest:cell, Value: !Ref Cell }]
          - ResourceType: volume
            Tags: [{ Key: nest, Value: "true" }, { Key: nest:cell, Value: !Ref Cell }]

  # --- The control plane's IAM user (FleetDO). Its access key is created at deploy and stored as a Worker secret.
  ControlPlaneUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "nest-${Cell}-control-plane"
      Tags: [{ Key: nest, Value: "true" }]
  ControlPlanePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: fleet
      Users: [!Ref ControlPlaneUser]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LaunchFromTemplateOnly
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${HostLaunchTemplate}"
            Condition:
              ArnLike: { ec2:LaunchTemplate: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${HostLaunchTemplate}" }
          - Sid: LaunchedResources
            Effect: Allow
            Action: ec2:RunInstances
            Resource:
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::image/*"
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:spot-instances-request/*"
            Condition:
              ArnLike: { ec2:LaunchTemplate: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${HostLaunchTemplate}" }
          - Sid: SecurityGroupFromTemplate
            Effect: Allow
            Action: ec2:RunInstances
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
            Condition:
              ArnLike: { ec2:LaunchTemplate: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${HostLaunchTemplate}" }
              Bool: { ec2:IsLaunchTemplateResource: "true" }
          - Sid: EightIOnly
            Effect: Allow
            Action: ec2:RunInstances
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              ArnLike: { ec2:LaunchTemplate: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${HostLaunchTemplate}" }
              StringLike: { ec2:InstanceType: ["c8i*.*", "m8i*.*", "r8i*.*"] }
          - Sid: TagAtLaunch
            Effect: Allow
            Action: ec2:CreateTags
            Resource: "*"
            Condition: { StringEquals: { ec2:CreateAction: [RunInstances, RequestSpotInstances] } }
          - Sid: PassHostRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt HostRole.Arn
            Condition: { StringEquals: { iam:PassedToService: ec2.amazonaws.com } }
          - Sid: StonithNestOnly
            Effect: Allow
            Action: [ec2:TerminateInstances, ec2:StopInstances]
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition: { StringEquals: { aws:ResourceTag/nest: "true" } }
          - Sid: Describe
            Effect: Allow
            Action: ec2:Describe*
            Resource: "*"
  ControlPlaneKmsPolicy:
    Type: AWS::IAM::Policy
    Condition: HasRootCaKey
    Properties:
      PolicyName: root-ca-sign
      Users: [!Ref ControlPlaneUser]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Action: [kms:Sign, kms:GetPublicKey], Resource: !Ref RootCaKeyArn }

Outputs:
  VpcId: { Value: !Ref Vpc }
  SubnetIds: { Value: !Join [",", [!Ref SubnetA, !Ref SubnetB, !Ref SubnetC]] }
  S3EndpointId: { Value: !Ref S3Endpoint }
  SecurityGroupId: { Value: !Ref HostSecurityGroup }
  BucketName: { Value: !Ref CellBucket }
  HostRoleArn: { Value: !GetAtt HostRole.Arn }
  LaunchTemplateId: { Value: !Ref HostLaunchTemplate }
  ControlPlaneUserName: { Value: !Ref ControlPlaneUser }

name = "nest-infra"
version = "0.1.0"
defaultTargets = ["Cell"]

[[require]]
name = "inframe"
git = "https://github.com/by77er/inframe"
rev = "a68f89ce683be8fd0f548da4fb74442142a55fac"
subDir = "lean"

[[require]]
name = "generated-aws"
path = ".generated/aws"

[[require]]
name = "generated-cloudflare"
path = ".generated/cloudflare"

# The host user data Cell.Stack embeds with `include_str`, which Lake doesn't trace: as inputs of
# the library, an edit to either rebuilds it (and the stack's executables) instead of keeping the
# scripts a cached build embedded.
[[input_file]]
name = "host-bootstrap"
path = "../host/bootstrap.sh"
text = true

[[input_file]]
name = "host-install"
path = "../host/install.sh"
text = true

[[lean_lib]]
name = "Cell"
globs = ["Cell.+"]
needs = ["host-bootstrap", "host-install"]

[[lean_exe]]
name = "cell-use1"
root = "Cell.Use1"

[[lean_exe]]
name = "cell-test"
root = "Cell.Test"

[[lean_lib]]
name = "Edge"
globs = ["Edge.+"]

[[lean_exe]]
name = "edge"
root = "Edge.Main"

[[lean_exe]]
name = "edge-test"
root = "Edge.Test"

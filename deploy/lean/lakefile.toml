name = "nest-infra"
version = "0.1.0"
defaultTargets = ["Cell"]

[[require]]
name = "inframe"
git = "https://github.com/by77er/inframe"
rev = "ea3880b268cdbd43addaaa92e3b3c7176204f1b9"
subDir = "lean"

[[require]]
name = "generated-aws"
path = ".generated/aws"

[[lean_lib]]
name = "Cell"
globs = ["Cell.+"]

[[lean_exe]]
name = "cell-use1"
root = "Cell.Use1"

[[lean_exe]]
name = "cell-test"
root = "Cell.Test"

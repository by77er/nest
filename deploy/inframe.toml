# nest's cloud infrastructure as an inframe project (https://github.com/by77er/inframe): Lean stacks
# rendered to OpenTofu. One stack per cell. See README.md.

[lean]
directory = "lean"
main = "cell-use1"
core = { git = "https://github.com/by77er/inframe", rev = "ea3880b268cdbd43addaaa92e3b3c7176204f1b9", subdir = "lean" }

# The provider schema is trimmed to the resource types nest uses (aws-schema.json, from
# `inframe provider inspect`) to keep it small, and drops the provider's `endpoints` block,
# which Lean can't compile. See README.md.
[providers.aws]
source = "hashicorp/aws"
version = "6.69.1"
module_root = "Aws"

[workspace]
directory = ".inframe"
graph_directory = ".inframe/graphs"

[stacks.use1]
frontend = "lean"
main = "cell-use1"
test = "cell-test"

[stacks.use1.backend]
type = "s3"

[stacks.use1.backend.config]
bucket = "nest-tfstate-589531222691"
key = "cells/use1.tfstate"
region = "us-east-1"
use_lockfile = true
encrypt = true

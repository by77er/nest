[package]
name = "nest-protocol"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# host-internal and gateway: variant enumeration for fixture-coverage tests (host.rs, gateway.rs)
strum = { version = "0.28", features = ["derive"] }
# gateway: binding tokens are base64url segments (gateway.rs)
base64 = "0.23.1"

[target.'cfg(unix)'.dependencies]
# host-internal: SCM_RIGHTS fd passing helpers (host.rs)
nix = { version = "0.31", features = ["socket", "uio"] }

[lints]
workspace = true

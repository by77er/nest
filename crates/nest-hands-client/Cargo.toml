[package]
name = "nest-hands-client"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3.34"
nest-protocol = { path = "../nest-protocol" }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["net", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
webpki-roots = "1.0.10"

[dev-dependencies]
nest-gateway = { path = "../nest-gateway", features = ["testing"] }
tempfile = "3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "process", "io-util"] }

[lints]
workspace = true

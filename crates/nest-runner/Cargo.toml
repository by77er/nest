[package]
name = "nest-runner"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
futures-util = "0.3.34"
nest-hands-client = { path = "../nest-hands-client" }
nest-protocol = { path = "../nest-protocol" }
# test-support only: an in-process gateway for this crate's tests and nest-cli's e2e tests
nest-gateway = { path = "../nest-gateway", optional = true }
nix = { version = "0.31.3", features = ["signal", "process"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
tokio-util = "0.7"

[features]
# `test_support::gateway`: a real gateway in-process, for tests of the hands path. Never on in
# a production build: the runner must not carry the gateway's code or its verification key.
test-support = ["dep:nest-gateway"]

[dev-dependencies]
nest-runner = { path = ".", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true

# cargo-deny (CI job `deny`): advisories, licenses, bans and sources for the Rust workspace and the
# standalone verification crates (verification/nestd/check, verification/nestd/fuzz), each checked
# against its own lockfile with this config.
# An advisory ignore must say why and when it can go.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# libFuzzer's runtime, linked only into the fuzz crate (verification/nestd/fuzz), never shipped.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[licenses.private]
ignore = true   # nest's own crates are unpublished

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true   # path dependencies between workspace crates

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

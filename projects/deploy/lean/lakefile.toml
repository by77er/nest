name = "nest-projects-infra"
version = "0.1.0"
defaultTargets = ["Projects"]

[[require]]
name = "inframe"
git = "https://github.com/by77er/inframe"
rev = "104e6f6d27252b0d3d2feb2753df7914b7a3b227"
subDir = "lean"

[[require]]
name = "generated-cloudflare"
path = ".generated/cloudflare"

[[lean_lib]]
name = "Projects"
globs = ["Projects.+"]

[[lean_exe]]
name = "projects"
root = "Projects.Main"

[[lean_exe]]
name = "projects-test"
root = "Projects.Test"

name = "nest-projects-infra"
version = "0.1.0"
defaultTargets = ["Projects"]

[[require]]
name = "inframe"
git = "https://github.com/by77er/inframe"
rev = "a68f89ce683be8fd0f548da4fb74442142a55fac"
subDir = "lean"

[[require]]
name = "generated-cloudflare"
path = ".generated/cloudflare"

[[lean_lib]]
name = "Projects"
globs = ["Projects.+"]

[[lean_exe]]
name = "projects"
root = "Projects.Main"

[[lean_exe]]
name = "projects-test"
root = "Projects.Test"
